services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  detector:
    build:
      context: .
      dockerfile: Dockerfile.detector
    command: python -m pipeline.detect --dry-run --api-url http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - API_URL=http://api:8000

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m pipeline.dashboard --api-url http://api:8000 --store-id STORE_BLR_002 --interval 2
    depends_on:
      api:
        condition: service_healthy
      detector:
        condition: service_started
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - API_URL=http://api:8000
