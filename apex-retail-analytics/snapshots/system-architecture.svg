<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720">
  <rect width="100%" height="100%" fill="#f6f7fb"/>
  <text x="50%" y="60" text-anchor="middle" font-size="28" fill="#111">System Architecture</text>
  <g font-family="monospace" font-size="14" fill="#222">
    <rect x="80" y="120" width="240" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="200" y="150" text-anchor="middle">CCTV Clips</text>
    <text x="200" y="170" text-anchor="middle" font-size="12" fill="#555">(footage/)</text>

    <rect x="400" y="120" width="260" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="530" y="150" text-anchor="middle">Detection Pipeline</text>
    <text x="530" y="170" text-anchor="middle" font-size="12" fill="#555">YOLOv8 + ByteTrack / simulator</text>

    <rect x="760" y="120" width="260" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="890" y="150" text-anchor="middle">Event Stream</text>
    <text x="890" y="170" text-anchor="middle" font-size="12" fill="#555">JSONL + POST /events/ingest</text>

    <line x1="320" y1="160" x2="400" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="660" y1="160" x2="760" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="80" y="260" width="320" height="120" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="240" y="290" text-anchor="middle">Intelligence API</text>
    <text x="240" y="310" text-anchor="middle" font-size="12" fill="#555">FastAPI — /stores/{id}/metrics</text>

    <rect x="420" y="260" width="320" height="120" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="580" y="290" text-anchor="middle">Dashboard / Consumers</text>
    <text x="580" y="310" text-anchor="middle" font-size="12" fill="#555">Terminal UI / Web UI</text>

    <line x1="240" y1="220" x2="240" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="560" y1="220" x2="560" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#6b7280" />
      </marker>
    </defs>
  </g>

  <text x="60" y="420" font-size="12" fill="#333">Notes: events written to <tspan font-family="monospace">artifacts/detection_events.jsonl</tspan></text>
</svg>